name: Arch Linux package

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install packaging tools
        run: pacman -Syu --noconfirm --needed base-devel git just rust

      - uses: actions/checkout@v4

      # The PKGBUILD builds the tagged release, so it is pointed at the
      # checked out sources instead. makepkg does not run as root.
      - name: Build
        run: |
          git config --global --add safe.directory "$PWD"
          pkgver=$(sed -n 's/^pkgver=//p' arch/PKGBUILD)
          tarball="cosmic-ext-classic-menu-$pkgver.tar.gz"
          mkdir build
          git archive --prefix="cosmic-ext-classic-menu-$pkgver/" -o "build/$tarball" HEAD
          sed "s|^source=.*|source=(\"$tarball\")|" arch/PKGBUILD > build/PKGBUILD
          useradd -m builder
          chown -R builder build
          cd build
          su builder -c "makepkg --noconfirm"

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: build/*.pkg.tar.zst

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arch-package
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.pkg.tar.zst'

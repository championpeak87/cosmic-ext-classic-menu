name: Fedora package

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install packaging tools
        run: dnf install -y dnf-plugins-core git rpm-build

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: dnf builddep -y rpm/cosmic-ext-classic-menu.spec

      # The spec builds the tagged release, so the checked out sources take
      # the place of its tarball.
      - name: Build
        run: |
          git config --global --add safe.directory "$PWD"
          version=$(sed -n 's/^Version: *//p' rpm/cosmic-ext-classic-menu.spec)
          mkdir -p ~/rpmbuild/SOURCES
          git archive --prefix="cosmic-ext-classic-menu-$version/" \
            -o ~/rpmbuild/SOURCES/"$version.tar.gz" HEAD
          rpmbuild -bb rpm/cosmic-ext-classic-menu.spec
          mkdir dist
          mv ~/rpmbuild/RPMS/*/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: fedora-package
          path: dist/*.rpm

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fedora-package
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.rpm'
